[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iosuite"
version = "0.1.0"
description = "Dynamic iOS Feature & Handler Interception CLI with Interactive TUI"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "iOSuite Team" }
]
dependencies = [
    "frida>=16.0.0",
    "textual>=0.80.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
    "capstone>=5.0.0",
    "pyperclip>=1.8.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0"
]

[project.scripts]
iosuite = "iosuite.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["iosuite*"]
package-data = { "iosuite" = ["agent/scripts/*.js", "ui/*.tcss", "ui/assets/*"] }
